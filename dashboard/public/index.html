<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL PITR Console</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 28, 36, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-online {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-offline {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-recovering {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .timeline-item:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .event-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-insert { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-update { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .badge-delete { background-color: rgba(239, 68, 68, 0.15); color: #f87171; }
        .badge-drop { background-color: #ef4444; color: #ffffff; animation: flash 1s infinite alternate; }
        .badge-commit { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-rollback { background-color: rgba(156, 163, 175, 0.15); color: #d1d5db; }

        @keyframes flash {
            0% { box-shadow: 0 0 2px #ef4444; }
            100% { box-shadow: 0 0 10px #ef4444; }
        }

        .lsn-text {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .event-detail {
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-top: 0.25rem;
        }

        .restore-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .restore-btn:hover {
            background-color: #2563eb;
        }

        .restore-btn:disabled {
            background-color: #374151;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #161c24;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 400px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-confirm {
            background: var(--danger);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>PostgreSQL Point-in-Time Recovery Console</h1>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">Hands-on WAL Log Analyzer & Restore Dashboard</p>
            </div>
            <div id="db-status-badge" class="status-badge status-offline">
                <span id="db-status-text">Checking Status</span>
            </div>
        </header>

        <main>
            <div class="card">
                <div class="meta-info">
                    <span>Active WAL File: <strong id="active-wal-file" style="font-family: monospace;">Loading...</strong></span>
                    <button onclick="fetchData()" class="restore-btn" style="background: transparent; border: 1px solid var(--border-color); padding: 0.25rem 0.5rem;">Refresh</button>
                </div>
                
                <div id="timeline-container" class="timeline">
                    <p style="text-align: center; color: var(--text-secondary);">Loading transaction timeline...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Confirmation Modal -->
    <div id="restore-modal" class="modal">
        <div class="modal-content" style="width: 450px;">
            <h3 style="margin-bottom: 0.5rem;">Confirm Restore?</h3>
            <p id="target-time-display" style="font-family: monospace; font-weight: bold; font-size: 1.1rem; color: var(--warning); margin-bottom: 1rem;"></p>
            
            <div style="text-align: left; margin: 1rem 0; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <label style="display: block; font-size: 0.9rem; margin-bottom: 0.5rem; cursor: pointer;">
                    <input type="radio" name="restore-mode" id="restore-mode-inplace" value="inplace" checked onchange="toggleRestoreFields()">
                    <strong>In-Place Restore</strong> (Stop & overwrite database)
                </label>
                <label style="display: block; font-size: 0.9rem; cursor: pointer;">
                    <input type="radio" name="restore-mode" id="restore-mode-fork" value="fork" onchange="toggleRestoreFields()">
                    <strong>Out-of-Place Fork</strong> (Zero Downtime, stream pg_dump)
                </label>
            </div>

            <div id="fork-fields" style="display: none; text-align: left; margin-bottom: 1rem;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 0.25rem;">Target Database Connection URL:</label>
                <input type="text" id="target-db-url" placeholder="postgresql://sujith:sujith@localhost:5432/db" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: #fff; font-family: monospace; font-size: 0.8rem;">
            </div>

            <div id="modal-actions" class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm" id="btn-confirm-action">Confirm Restore</button>
            </div>
            <div id="modal-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p id="modal-loading-text" style="font-size: 0.8rem; color: var(--text-secondary);">Restoring... Database container will restart.</p>
            </div>
        </div>
    </div>

    <script>
        let selectedTimestamp = '';

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const badge = document.getElementById('db-status-badge');
                const text = document.getElementById('db-status-text');

                badge.className = 'status-badge';
                if (data.databaseStatus === 'ONLINE') {
                    badge.classList.add('status-online');
                    text.innerText = 'Online';
                } else if (data.databaseStatus === 'STARTING/RECOVERING') {
                    badge.classList.add('status-recovering');
                    text.innerText = 'Recovering';
                } else {
                    badge.classList.add('status-offline');
                    text.innerText = 'Offline';
                }
            } catch (err) {
                console.error("Error updating status", err);
            }
        }

        async function fetchData() {
            await updateStatus();
            try {
                const res = await fetch('/api/wal');
                const data = await res.json();
                
                document.getElementById('active-wal-file').innerText = data.activeWalFile || 'None';

                const container = document.getElementById('timeline-container');
                container.innerHTML = '';

                if (!data.events || data.events.length === 0) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-secondary);">No client transactions found in current WAL segment.</p>`;
                    return;
                }

                data.events.forEach(event => {
                    const item = document.createElement('div');
                    item.className = 'timeline-item';

                    // Parse timestamp if available or generate target timestamp based on current system time (estimating timeline offset)
                    // For the lab, we will generate target time by getting the current date and setting hours/minutes/seconds
                    // based on a mock calculation to keep LSN mappings, but to make recovery test functional,
                    // we'll pass a time calculated from the system time.
                    // For safety in this lab, since we want the time BEFORE this event, we'll format it as a valid date string.
                    const now = new Date();
                    // We generate an estimated timestamp for the target time input
                    const timeStr = now.toISOString().replace('T', ' ').substring(0, 19);

                    item.innerHTML = `
                        <div class="event-info">
                            <div class="event-header">
                                <span class="badge badge-${event.opType.toLowerCase()}">${event.opType}</span>
                                <span class="lsn-text">LSN: ${event.lsn} (TX: ${event.tx})</span>
                            </div>
                            <div class="event-detail">${event.detail}</div>
                        </div>
                        <div>
                            <button class="restore-btn" onclick="openRestoreModal('${event.lsn}')">
                                Restore to LSN
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error("Error fetching data", err);
            }
        }

        function toggleRestoreFields() {
            const isFork = document.getElementById('restore-mode-fork').checked;
            document.getElementById('fork-fields').style.display = isFork ? 'block' : 'none';
        }

        function openRestoreModal(lsn) {
            selectedTimestamp = lsn;
            document.getElementById('target-time-display').innerText = `LSN: ${lsn}`;
            document.getElementById('restore-modal').style.display = 'flex';
            
            // Set up click handler
            document.getElementById('btn-confirm-action').onclick = triggerRestore;
        }

        function closeModal() {
            document.getElementById('restore-modal').style.display = 'none';
            document.getElementById('modal-actions').style.display = 'flex';
            document.getElementById('modal-loading').style.display = 'none';
            document.getElementById('restore-mode-inplace').checked = true;
            document.getElementById('fork-fields').style.display = 'none';
            document.getElementById('target-db-url').value = '';
        }

        async function triggerRestore() {
            const isFork = document.getElementById('restore-mode-fork').checked;
            const targetDbUrl = isFork ? document.getElementById('target-db-url').value.trim() : null;

            if (isFork && !targetDbUrl) {
                alert('Please enter a target database connection URL.');
                return;
            }

            document.getElementById('modal-actions').style.display = 'none';
            document.getElementById('modal-loading').style.display = 'block';
            document.getElementById('modal-loading-text').innerText = isFork 
                ? 'Restoring via fork clone... This will take a moment.' 
                : 'Restoring in-place... Database container will restart.';

            try {
                const res = await fetch('/api/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        lsn: selectedTimestamp,
                        targetDbUrl: targetDbUrl
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('Restore completed successfully!');
                } else {
                    alert('Restore failed: ' + data.error);
                }
            } catch (err) {
                alert('Connection error during restore.');
            } finally {
                closeModal();
                setTimeout(fetchData, isFork ? 2000 : 6000); // refresh after 6 seconds if in-place
            }
        }

        // Initial load
        fetchData();
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
