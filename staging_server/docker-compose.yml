version: "3.9"

services:
  db:
    # We must build a custom image to install pgBackRest
    build: ./postgres
    image: postgres:18
    container_name: postgres_db_18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Kolkata
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      # Your existing database volume
      - /home/dev/docker-containers/postgres18/postgres_data:/var/lib/postgresql/18/docker
      
      # The configuration files required for PITR
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf
      
      # The local backups folder (for staging)
      - ./backups:/backups

    # Tell PostgreSQL to use the custom config files
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf"
      ]
