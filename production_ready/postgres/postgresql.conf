# ==============================================================================
# Production PostgreSQL Configuration File (PITR + Logical Decoding Enabled)
# ==============================================================================

# Connection Settings
listen_addresses = '*'
max_connections = 200

# Memory Settings
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB

# Write-Ahead Log (WAL)
wal_level = logical                     # Essential for Logical Decoding & PITR
track_commit_timestamp = on             # Native transaction commit timestamp tracking
fsync = on                              # Physical disk flush safety
synchronous_commit = on
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Replication Slots & Sendors (Logical Decoding Support)
max_replication_slots = 10
max_wal_senders = 10

# WAL Archiving (pgBackRest Integration)
archive_mode = on
archive_command = 'pgbackrest --stanza=db archive-push %p'
archive_timeout = 300                   # Force WAL segment push every 5 minutes

# Logging & Auditing
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_line_prefix = '%m [%p] %q%u@%d '
